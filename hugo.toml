baseURL = "https://example.org/"
locale = "zh-cn"
theme = "hugo-theme-yinyang"
title = "LucasYo"
DefaultContentLanguage = "cn"
enableRobotsTXT = true

[languages]
  [languages.cn]
    contentDir = "content/cn"
    languageName = "简体中文"
    weight = 1

[permalinks]
  post = "/posts/:title/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    style = "tango"
    tabWidth = 2

[params]
  description = "记录生活与技术"
  headTitle = "LucasYo"
  mainSections = ["posts"]
  postHeaderContent = ""
  postFooterContent = ""
  favicon = "/favicon-96x96.png"

  [params.author]
    name = "LucasYo"
    homepage = "/"

[[params.socials]]
  name = "About"
  link = "/about/"
